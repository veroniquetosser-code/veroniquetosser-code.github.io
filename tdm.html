<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f5f0e1;
        color: #333333;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
      }

      h1 {
        color: #2c3e50;
        text-align: center;
      }

      .carte {
        background-color: #ffffff;
        border-radius: 12px;
        padding: 20px 30px;
        margin: 20px 0;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      }

      progress {
        width: 100%;
        height: 24px;
      }

      .etape {
        padding: 8px 0;
        border-bottom: 1px solid #eee;
      }
      .franchie {
        color: #27ae60;
        font-weight: bold;
      }
      .actuelle {
        color: #e67e22;
        font-weight: bold;
      }
      .avenir {
        color: #999999;
      }
      
    </style>
  </head>
  <body>
    <h1>Tour du monde en famille</h1>

    <div class="carte">
      <p>Distance parcourue : <span id="totalKm"></span> km</p>
      <progress id="barre" max="40075" value="0"></progress>
      <p><span id="pourcent"></span> % du tour du monde</p>
    </div>

    <div class="carte">
      <p>Dernière étape franchie : <span id="etapeFranchie"></span></p>
      <p>Prochaine étape : <span id="prochaine"></span></p>
      <p>Il reste <span id="distanceRestante"></span> km avant d'y arriver</p>
    </div>

    <div class="carte">
      <h2>Le parcours</h2>
      <div id="listeEtapes"></div>
    </div>
    
    <script>
      let facteur = 0.0008;

      let etapes = [
        { ville: "Paris", km: 0 },
        { ville: "Le Caire", km: 3200 },
        { ville: "Nairobi", km: 6800 },
        { ville: "Le Cap", km: 10500 },
        { ville: "Mumbai", km: 14800 },
        { ville: "Bangkok", km: 18200 },
        { ville: "Singapour", km: 20400 },
        { ville: "Tokyo", km: 23500 },
        { ville: "Sydney", km: 27800 },
        { ville: "Honolulu", km: 31200 },
        { ville: "Los Angeles", km: 34100 },
        { ville: "New York", km: 37200 },
        { ville: "Paris (retour)", km: 40075 }
      ];

      async function charger() {
        let reponse = await fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vTUZi3CsGzOGS_VeA1APDKwrq1ZZrDc5tTmNPydoZSbWz4HrOvfCFll0hE7upi2GC5fsGyVdqBn6BiC/pub?output=csv");
        let texte = await reponse.text();
        let lignes = texte.split("\n");

        let totalPas = 0;
        for (let i = 1; i < lignes.length; i++) {
          let colonnes = lignes[i].split(",");
          let pas = Number(colonnes[3]);
          totalPas = totalPas + pas;
        }

        let totalKm = Math.round(totalPas * facteur);

        let indexActuelle = 0;
        for (let i = 0; i < etapes.length; i++) {
          if (totalKm >= etapes[i].km) {
            indexActuelle = i;
          }
        }

        let etapeFranchie = etapes[indexActuelle];
        let prochaineEtape = etapes[indexActuelle + 1];
        let distanceRestante = prochaineEtape.km - totalKm;

        document.getElementById("totalKm").textContent = totalKm.toLocaleString("fr-FR");
        document.getElementById("etapeFranchie").textContent = etapeFranchie.ville;
        document.getElementById("prochaine").textContent = prochaineEtape.ville;
        document.getElementById("distanceRestante").textContent = distanceRestante.toLocaleString("fr-FR");
        document.getElementById("barre").value = totalKm;
        document.getElementById("pourcent").textContent = Math.round(totalKm / 40075 * 100);

              let html = "";
        for (let i = 0; i < etapes.length; i++) {
          let classe = "avenir";
          let marque = "";
          if (i < indexActuelle) {
            classe = "franchie";
            marque = " ✓";
          }
          if (i === indexActuelle) {
            classe = "actuelle";
            marque = " ← vous êtes ici";
          }
      html = html + "<div class='etape " + classe + "'>" + etapes[i].ville + " (" + etapes[i].km.toLocaleString("fr-FR") + " km)" + marque + "</div>";
        }
        document.getElementById("listeEtapes").innerHTML = html;
      }


      charger();
    </script>
  </body>
</html>
