<!DOCTYPE html>
<html>
  <head>
    <style>
  /* ========================================= */
  /* STYLES (apparence de la page)             */
  /* ========================================= */
    
      body {
        
  /* Paramètres généraux de la page */
        
        font-family: Arial, sans-serif;
        background-color: #f5f0e1;
        color: #333333;
        max-width: 900px;
        margin: 40px auto;
        padding: 0 20px;
      }
      
  /* h1 = titre principal */
      
      h1 {
        color: #2c3e50;
        text-align: center;
      }

  /* apparence des cartes blanches */
      
      .carte {
        background-color: #ffffff;
        border-radius: 12px;
        padding: 20px 30px;
        margin: 20px 0;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      }
      
/* Style liste des étapes du TDM */
      
      #listeEtapes {
        position: relative;
        padding-left: 28px;
      }
      
      #listeEtapes::before {
        content: "";
        position: absolute;
        left: 7px;
        top: 8px;
        bottom: 8px;
        width: 2px;
        background-color: #ddd;
      }
      
      .etape {
        position: relative;
        padding: 6px 0;
        font-size: 14px;
      }
      
      .etape::before {
        content: "";
        position: absolute;
        left: -25px;
        top: 11px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background-color: #ddd;
        border: 2px solid #f5f0e1;
      }
      .franchie {
        color: #80a343;
      }
      .franchie::before {
        background-color: #80a343;
      }
      .actuelle {
        color: #4e7a01;
        font-weight: bold;
      }
      .actuelle::before {
        background-color: #4e7a01;
        width: 14px;
        height: 14px;
        left: -27px;
        top: 9px;
      }
      .avenir {
        color: #aaa;
      }

/* Style des 4 blocs d'indicateurs */
      
      .indicateurs {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }
      .indic {
        background-color: #ffffff;
        border-radius: 12px;
        padding: 16px 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        flex: 1;
        min-width: 140px;
      }
      .indic .label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #999999;
        margin-bottom: 6px;
      }
      .indic .valeur {
        font-size: 26px;
        font-weight: bold;
        color: #2c3e50;
      }
      .indic .detail {
        font-size: 13px;
        color: #999999;
        margin-top: 4px;
      }

      .indic-1 { border-top: 4px solid #27ae60; }
      .indic-2 { border-top: 4px solid #e67e22; }
      .indic-3 { border-top: 4px solid #2980b9; }
      .indic-4 { border-top: 4px solid #8e44ad; }

      .indic-1 .valeur { color: #27ae60; }
      .indic-2 .valeur { color: #e67e22; }
      .indic-3 .valeur { color: #2980b9; }
      .indic-4 .valeur { color: #8e44ad; }

      .rang {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
        border-bottom: 1px solid #eee;
      }
      .position {
        font-weight: bold;
        color: #999;
        min-width: 24px;
      }
      .nomP {
        font-weight: bold;
        flex: 1;
      }
      .pasP {
        color: #666;
        font-size: 14px;
      }
      
    </style>
  </head>
  
  <body>

<!-- ========================================= -->
<!-- CONTENU DE LA PAGE                        -->
<!-- ========================================= -->

    <h1>Tour du monde en famille</h1>

<div class="indicateurs">
  
      <div class="indic indic-1">
        <div class="label">Distance parcourue</div>
        <div class="valeur"><span id="totalKm"></span> km</div>
        <div class="detail"><span id="pourcent"></span> % du tour</div>
      </div>
  
      <div class="indic indic-2">
        <div class="label">Km restants</div>
        <div class="valeur"><span id="kmRestants"></span> km</div>
        <div class="detail">jusqu'à Paris</div>
      </div>
  
      <div class="indic indic-3">
        <div class="label">Rythme moyen</div>
        <div class="valeur"><span id="kmParSemaine"></span></div>
        <div class="detail">km / semaine</div>
      </div>
  
      <div class="indic indic-4">
        <div class="label">Semaines restantes</div>
        <div class="valeur"><span id="semainesRestantes"></span></div>
        <div class="detail">au rythme actuel</div>
      </div>

</div>

       <div class="carte">
         
      <h2>Le parcours</h2>
         
      <div id="listeEtapes"></div>
       </div>

    <div class="carte">
      <h2>Classement de la semaine</h2>
      <div id="classementSemaine"></div>
    </div>
    
    <div class="carte">
      <h2>Classement général</h2>
      <div id="classement"></div>
    </div>
    
    <script>

  // ===========================================
  // CALCULS ET AFFICHAGE
  // ===========================================
      
      let facteur = 0.0008;

      let etapes = [
        { ville: "Paris", km: 0 },
        { ville: "Le Caire", km: 3200 },
        { ville: "Nairobi", km: 6800 },
        { ville: "Le Cap", km: 10500 },
        { ville: "Mumbai", km: 14800 },
        { ville: "Bangkok", km: 18200 },
        { ville: "Singapour", km: 20400 },
        { ville: "Tokyo", km: 23500 },
        { ville: "Sydney", km: 27800 },
        { ville: "Honolulu", km: 31200 },
        { ville: "Los Angeles", km: 34100 },
        { ville: "New York", km: 37200 },
        { ville: "Paris (retour)", km: 40075 }
      ];

  // Liaison avec le google sheet

      async function charger() {
        let reponse = await fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vTUZi3CsGzOGS_VeA1APDKwrq1ZZrDc5tTmNPydoZSbWz4HrOvfCFll0hE7upi2GC5fsGyVdqBn6BiC/pub?output=csv");
        let texte = await reponse.text();
        let lignes = texte.split("\n");

// Lecture total des pas
        
        let totalPas = 0;
        for (let i = 1; i < lignes.length; i++) {
          let colonnes = lignes[i].split(",");
          let pas = Number(colonnes[3]);
          totalPas = totalPas + pas;
        }
        
// Calcul des autres indicateurs
        
        let totalKm = Math.round(totalPas * facteur);

        let semainesVues = [];
        for (let i = 1; i < lignes.length; i++) {
          let colonnes = lignes[i].split(",");
          let annee = colonnes[1];
          let semaine = colonnes[0];
          let cle = annee + "-" + semaine;
          if (semainesVues.includes(cle) === false) {
            semainesVues.push(cle);
          }
        }
        let semainesEcoulees = semainesVues.length;

        let kmParSemaine = Math.round(totalKm / semainesEcoulees);

        let kmRestants = 40075 - totalKm;
        let semainesRestantes = Math.round(kmRestants / kmParSemaine);

        let indexActuelle = 0;
        for (let i = 0; i < etapes.length; i++) {
          if (totalKm >= etapes[i].km) {
            indexActuelle = i;
          }
        }

        let etapeFranchie = etapes[indexActuelle];
        let prochaineEtape = etapes[indexActuelle + 1];
        let distanceRestante = prochaineEtape.km - totalKm;

// --- Total de pas par participant ---
        let totaux = {};
        for (let i = 1; i < lignes.length; i++) {
          let colonnes = lignes[i].split(",");
          let nom = colonnes[2];
          let pas = Number(colonnes[3]);

          if (totaux[nom] === undefined) {
            totaux[nom] = 0;
          }
          totaux[nom] = totaux[nom] + pas;
        }

// --- Transformer l'objet en liste triable ---
        let classement = [];
        for (let nom in totaux) {
          classement.push({ nom: nom, pas: totaux[nom] });
        }

// --- Trier du plus grand au plus petit ---
        classement.sort(function(a, b) {
          return b.pas - a.pas;
        });

// --- Affichage du classement ---
        let htmlClassement = "";
        for (let i = 0; i < classement.length; i++) {
          let rang = i + 1;
          let personne = classement[i];
          let km = Math.round(personne.pas * facteur);
          htmlClassement = htmlClassement + "<div class='rang'><span class='position'>" + rang + "</span> <span class='nomP'>" + personne.nom + "</span> <span class='pasP'>" + personne.pas.toLocaleString("fr-FR") + " pas (" + km.toLocaleString("fr-FR") + " km)</span></div>";
        }
        document.getElementById("classement").innerHTML = htmlClassement;

// --- Trouver la dernière semaine (année puis numéro) ---
        let derniereAnnee = 0;
        let derniereSemaine = 0;
        for (let i = 1; i < lignes.length; i++) {
          let colonnes = lignes[i].split(",");
          let annee = Number(colonnes[1]);
          let semaine = Number(colonnes[0]);
          if (annee > derniereAnnee) {
            derniereAnnee = annee;
            derniereSemaine = semaine;
          }
          if (annee === derniereAnnee && semaine > derniereSemaine) {
            derniereSemaine = semaine;
          }
        }

// --- Classement de la dernière semaine ---
        let totauxSemaine = {};
        for (let i = 1; i < lignes.length; i++) {
          let colonnes = lignes[i].split(",");
          let annee = Number(colonnes[1]);
          let semaine = Number(colonnes[0]);

          if (annee === derniereAnnee && semaine === derniereSemaine) {
            let nom = colonnes[2];
            let pas = Number(colonnes[3]);
            if (totauxSemaine[nom] === undefined) {
              totauxSemaine[nom] = 0;
            }
            totauxSemaine[nom] = totauxSemaine[nom] + pas;
          }
        }

        let classementSemaine = [];
        for (let nom in totauxSemaine) {
          classementSemaine.push({ nom: nom, pas: totauxSemaine[nom] });
        }
        classementSemaine.sort(function(a, b) {
          return b.pas - a.pas;
        });

// --- Affichage du classement de la semaine ---
        let htmlSemaine = "";
        for (let i = 0; i < classementSemaine.length; i++) {
          let rang = i + 1;
          let personne = classementSemaine[i];
          let km = Math.round(personne.pas * facteur);
          htmlSemaine = htmlSemaine + "<div class='rang'><span class='position'>" + rang + "</span> <span class='nomP'>" + personne.nom + "</span> <span class='pasP'>" + personne.pas.toLocaleString("fr-FR") + " pas (" + km.toLocaleString("fr-FR") + " km)</span></div>";
        }
        document.getElementById("classementSemaine").innerHTML = htmlSemaine;

// Pont entre calcul et affichage
        
        document.getElementById("totalKm").textContent = totalKm.toLocaleString("fr-FR");
        document.getElementById("pourcent").textContent = Math.round(totalKm / 40075 * 100);
        document.getElementById("kmParSemaine").textContent = kmParSemaine.toLocaleString("fr-FR");
        document.getElementById("semainesRestantes").textContent = semainesRestantes;
        document.getElementById("kmRestants").textContent = kmRestants.toLocaleString("fr-FR");

// Affichage des étapes
        
              let html = "";
        for (let i = 0; i < etapes.length; i++) {
          let classe = "avenir";
          let marque = "";
      if (i < indexActuelle) {
            classe = "franchie";
            marque = "";
          }
          if (i === indexActuelle) {
            classe = "actuelle";
            marque = " ← vous êtes ici (encore " + distanceRestante.toLocaleString("fr-FR") + " km avant " + prochaineEtape.ville + ")";
          }
      html = html + "<div class='etape " + classe + "'>" + etapes[i].ville + " (" + etapes[i].km.toLocaleString("fr-FR") + " km)" + marque + "</div>";
        }
        document.getElementById("listeEtapes").innerHTML = html;
      }


      charger();
    </script>
  </body>
</html>
